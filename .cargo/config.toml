# Cross-compiling the example for Windows from Linux:
#   rustup target add x86_64-pc-windows-gnu
#   apt install gcc-mingw-w64-x86-64   (provides the linker below)
#   cargo build --release --target x86_64-pc-windows-gnu --manifest-path example/Cargo.toml
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
